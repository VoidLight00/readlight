<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#F5A623"/>
      <stop offset="50%" style="stop-color:#F7C948"/>
      <stop offset="100%" style="stop-color:#FFE082"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Book -->
  <g transform="translate(256,280)">
    <path d="M-80,40 L-80,-60 Q-80,-80 -60,-80 L-10,-80 L-10,40 Z" fill="#e0e0e0" opacity="0.9"/>
    <path d="M80,40 L80,-60 Q80,-80 60,-80 L10,-80 L10,40 Z" fill="#d0d0d0" opacity="0.9"/>
    <path d="M-10,-80 L-10,40 L0,48 L10,40 L10,-80 L0,-72 Z" fill="#bbb" opacity="0.7"/>
    <!-- Lines on pages -->
    <line x1="-60" y1="-50" x2="-20" y2="-50" stroke="#999" stroke-width="3" stroke-linecap="round"/>
    <line x1="-60" y1="-30" x2="-25" y2="-30" stroke="#999" stroke-width="3" stroke-linecap="round"/>
    <line x1="-60" y1="-10" x2="-30" y2="-10" stroke="#999" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="-50" x2="60" y2="-50" stroke="#888" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="-30" x2="60" y2="-30" stroke="#888" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="-10" x2="60" y2="-10" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Flame / Light -->
  <g transform="translate(256,160)">
    <ellipse cx="0" cy="40" rx="30" ry="10" fill="#F5A623" opacity="0.2"/>
    <path d="M0,30 Q-20,-10 -8,-40 Q-2,-20 0,-50 Q2,-20 8,-40 Q20,-10 0,30Z" fill="url(#flame)"/>
    <ellipse cx="0" cy="10" rx="6" ry="12" fill="#FFF8E1" opacity="0.8"/>
  </g>
</svg>
